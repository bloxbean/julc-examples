name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Devnet (cardano-node) + Yaci Store (localhost:8080) + Ogmios, admin API on localhost:10000.
      # The *IntegrationTest classes skip themselves when these are not reachable.
      - name: Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit
          nohup yaci-devkit up --enable-yaci-store > "$RUNNER_TEMP/yaci-devkit.log" 2>&1 &

      - name: Build
        run: ./gradlew build -x test

      - name: Wait for Yaci DevKit
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/api/v1/blocks/latest \
                && curl -sf -o /dev/null http://localhost:10000/local-cluster/api/admin/devnet; then
              echo "Yaci DevKit is up"
              exit 0
            fi
            sleep 5
          done
          echo "Yaci DevKit did not start within 5 minutes"
          tail -n 200 "$RUNNER_TEMP/yaci-devkit.log"
          exit 1

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

      - name: Upload Yaci DevKit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaci-devkit-log
          path: ${{ runner.temp }}/yaci-devkit.log
