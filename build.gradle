plugins {
    id 'java'
    id 'application'
    id 'org.julclang.julc' version '0.1.0-pre17-8fb33f4-SNAPSHOT'
}

group = 'com.example'
version = '0.1.0'

ext {
    julcVersion = '0.1.0-pre17-8fb33f4-SNAPSHOT'
    cardanoClientLibVersion = '0.8.0-pre5'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots")
        content {
            snapshotsOnly()
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    exclude 'com/example/benchmark/wingriders/**'
}

sourceSets.test.java {
    exclude 'com/example/benchmark/wingriders/**'
}

dependencies {
    // Stdlib — annotations (@Validator, @MintingPolicy, @Entrypoint),
    // stdlib libs (ContextsLib, ListsLib, etc.)
    implementation "org.julclang:julc-stdlib:${julcVersion}"

    implementation "org.julclang:julc-cardano-client-lib:${julcVersion}"
    // Annotation processor — compiles @Validator/@MintingPolicy classes to UPLC during javac
    annotationProcessor "org.julclang:julc-annotation-processor:${julcVersion}"

    // Runtime — JulcScriptLoader for loading compiled scripts at runtime
    implementation "org.julclang:julc-annotation-processor:${julcVersion}"

    runtimeOnly "org.julclang:julc-vm-java:${julcVersion}"

    // cardano-client-lib — off-chain transaction building
    implementation "com.bloxbean.cardano:cardano-client-lib:${cardanoClientLibVersion}"
    implementation "com.bloxbean.cardano:cardano-client-merkle-patricia-forestry-rocksdb:${cardanoClientLibVersion}"
    implementation "com.bloxbean.cardano:cardano-client-backend-blockfrost:${cardanoClientLibVersion}"

    // Test dependencies
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    testImplementation "org.julclang:julc-testkit:${julcVersion}"
    testImplementation "org.julclang:julc-testkit-jqwik:${julcVersion}"
    testImplementation "org.julclang:julc-compiler:${julcVersion}"
    testImplementation "org.julclang:julc-stdlib:${julcVersion}"
    testRuntimeOnly "org.julclang:julc-vm-java:${julcVersion}"
//    testImplementation "org.julclang:julc-vm-truffle:${julcVersion}"  // For JulcDebugger API
//    testImplementation "org.julclang:julc-vm-scalus:${julcVersion}"   // Scalus VM backend — cross-VM budget comparison
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

application {
    mainClass = project.findProperty('mainClass') ?: 'com.example.offchain.VestingDemo'
}

